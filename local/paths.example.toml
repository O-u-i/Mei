# The initializer writes paths.toml with absolute paths for this machine.
# This template contains no installation-specific values.
[paths]
mei_root = "<absolute-path-to-Mei-checkout>"
memory_root = "<absolute-path-to-Mei-checkout>/memory/markdown"
codex_home = "<absolute-path-to-personal-Codex-directory>"
codex_home_gui = "<absolute-path-to-GUI-Codex-directory>"
codex_home_tui = "<absolute-path-to-TUI-Codex-directory>"
codex_memory_source_gui = "<absolute-path-to-GUI-Codex-directory>/memories"
codex_memory_source_tui = "<absolute-path-to-TUI-Codex-directory>/memories"
skills_root = "<absolute-path-to-personal-Codex-skills>"
inbox = "<absolute-path-to-Mei-inbox>"
obsidian_vault = "<absolute-path-to-existing-Obsidian-vault>"
obsidian_memory_dir = "Mei Memory"

[profiles]
project = "mei-project"
maintainer = "mei-maintainer"
